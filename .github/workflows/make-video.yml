name: make-video
on:
  push:
    paths: ["specs/*.json"]
  workflow_dispatch:
    inputs:
      spec:
        description: "Ficheiro spec (ex.: specs/teste1.json)"
        required: true
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Escolher specs
        id: pick
        env:
          INPUT_SPEC: ${{ github.event.inputs.spec }}
        run: |
          if [ -n "$INPUT_SPEC" ]; then
            echo "files=$INPUT_SPEC" >> $GITHUB_OUTPUT
          else
            echo "files=$(git diff --name-only HEAD~1 HEAD -- 'specs/*.json' | tr '\n' ' ')" >> $GITHUB_OUTPUT
          fi
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - run: pip install sherpa-onnx numpy pillow
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg fonts-dejavu-core
      - name: Modelo Kokoro
        run: |
          curl -sL --retry 5 -o k.tar.bz2 https://github.com/k2-fsa/sherpa-onnx/releases/download/tts-models/kokoro-multi-lang-v1_0.tar.bz2
          tar xjf k.tar.bz2
      - name: Gerar videos
        env:
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          GH_TOKEN: ${{ github.token }}
          RUN_NUMBER: ${{ github.run_number }}
          FILES: ${{ steps.pick.outputs.files }}
        run: |
          for spec in $FILES; do
            name=$(basename "$spec" .json)
            qs=$(python3 -c "import json;s=json.load(open('$spec'));q=s.get('pexels_queries') or ([s['pexels_query']] if s.get('pexels_query') else []);print(chr(10).join(q))")
            bg=""; i=0
            if [ -n "$PEXELS_API_KEY" ]; then
              while IFS= read -r q; do
                [ -z "$q" ] && continue
                python3 tools/fetch_pexels.py "$q" "bg_${name}_$i.mp4" "cr_${name}_$i.txt" $i && bg="$bg bg_${name}_$i.mp4"
                i=$((i+1))
              done <<< "$qs"
            fi
            cat cr_${name}_*.txt > "credits_$name.txt" 2>/dev/null || true
            python3 tools/make_video.py "$spec" "$name.mp4" ${bg:+--bg $bg} --model kokoro-multi-lang-v1_0
            files="$name.mp4"
            if [ -f "credits_$name.txt" ]; then files="$files credits_$name.txt"; fi
            gh release create "video-$name-$RUN_NUMBER" $files --title "$name" --notes "Gerado por make-video. Clips: Pexels (ver credits)."
          done
